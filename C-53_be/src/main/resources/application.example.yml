# C-53 配置示例
# 使用方式：复制为 application.yml，按本地环境修改。
# 生产环境必须通过环境变量覆盖所有密码与密钥，禁止使用本文件中的开发占位值。
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never

spring:
  application:
    name: c53-server
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:c_53}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=utf8&useUnicode=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 1
      connection-timeout: 3000
      validation-timeout: 2000
      idle-timeout: 60000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 2s
      connect-timeout: 2s
      lettuce:
        shutdown-timeout: 100ms
  sql:
    init:
      mode: ${DB_INIT_MODE:always}
      schema-locations:
        - classpath:db/auth/auth-schema-v2.sql
        - classpath:db/post/post-schema.sql
      continue-on-error: false
      encoding: UTF-8
  servlet:
    multipart:
      # 服务端上传通道上限 10MB，这里留出 multipart 边界与表单字段的余量
      max-file-size: ${MEDIA_MAX_FILE_SIZE:12MB}
      max-request-size: ${MEDIA_MAX_REQUEST_SIZE:16MB}
      file-size-threshold: 0
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always
  mvc:
    problemdetails:
      enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    banner: false
    db-config:
      id-type: input

logging:
  level:
    root: INFO
    com.c53: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-no-request}] %logger{36} - %msg%n"

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:c53-dev-only-jwt-secret-replace-in-production}
    issuer: ${AUTH_JWT_ISSUER:c53}
    access-ttl: ${AUTH_ACCESS_TTL:15m}
  refresh:
    remember-ttl: ${AUTH_REFRESH_REMEMBER_TTL:7d}
    short-ttl: ${AUTH_REFRESH_SHORT_TTL:24h}
    concurrent-grace: ${AUTH_REFRESH_CONCURRENT_GRACE:5s}
  hmac:
    secret: ${AUTH_HMAC_SECRET:c53-dev-only-hmac-secret-replace-in-production}
    key-version: ${AUTH_HMAC_KEY_VERSION:1}
  verification:
    ttl: ${AUTH_VERIFICATION_TTL:5m}
    resend-interval: ${AUTH_VERIFICATION_RESEND_INTERVAL:60s}
    max-attempts: ${AUTH_VERIFICATION_MAX_ATTEMPTS:5}
    # 仅开发环境使用；生产必须关闭并接入真实短信/邮件发送器
    dev-mode: ${AUTH_VERIFICATION_DEV_MODE:true}
    dev-code: ${AUTH_VERIFICATION_DEV_CODE:123456}
  device:
    cookie-name: ${AUTH_DEVICE_COOKIE_NAME:c53_device_session}
    cookie-ttl: ${AUTH_DEVICE_COOKIE_TTL:180d}
    secure: ${AUTH_DEVICE_COOKIE_SECURE:false}
  redis:
    key-prefix: ${AUTH_REDIS_KEY_PREFIX:auth}
  limits:
    login-per-ip-per-minute: ${AUTH_LIMIT_LOGIN_IP_PER_MINUTE:20}
    login-failures-per-account: ${AUTH_LIMIT_LOGIN_FAILURES_ACCOUNT:5}
    login-failure-window: ${AUTH_LIMIT_LOGIN_FAILURE_WINDOW:15m}
    registration-per-ip-per-hour: ${AUTH_LIMIT_REGISTRATION_IP_PER_HOUR:20}
    refresh-per-session-per-hour: ${AUTH_LIMIT_REFRESH_SESSION_PER_HOUR:60}
    switch-per-device-per-minute: ${AUTH_LIMIT_SWITCH_DEVICE_PER_MINUTE:10}
    username-check-per-ip-per-minute: ${AUTH_LIMIT_USERNAME_IP_PER_MINUTE:60}
  cors:
    allowed-origins: ${AUTH_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# 媒体与 OSS。bucket 为空时媒体接口返回 503，纯文字功能仍可用。
# 生产环境通过环境变量注入 AK/SK 与角色 ARN，禁止把真实值写进本文件。
media:
  env: ${MEDIA_ENV:dev}
  endpoint: ${MEDIA_OSS_ENDPOINT:}
  region: ${MEDIA_OSS_REGION:oss-cn-hangzhou}
  bucket: ${MEDIA_BUCKET:}
  access-key-id: ${MEDIA_ACCESS_KEY_ID:}
  access-key-secret: ${MEDIA_ACCESS_KEY_SECRET:}
  role-arn: ${MEDIA_ROLE_ARN:}
  role-session-name: ${MEDIA_ROLE_SESSION_NAME:c53-upload}
  sts-endpoint: ${MEDIA_STS_ENDPOINT:sts.cn-hangzhou.aliyuncs.com}
  sts-region: ${MEDIA_STS_REGION:cn-hangzhou}
  ticket-ttl: ${MEDIA_TICKET_TTL:15m}
  part-size: ${MEDIA_PART_SIZE:5MB}
  signed-url-ttl: ${MEDIA_SIGNED_URL_TTL:1h}
  temp-ttl: ${MEDIA_TEMP_TTL:24h}
  orphan-ttl: ${MEDIA_ORPHAN_TTL:24h}
  server-upload-max-bytes: ${MEDIA_SERVER_UPLOAD_MAX_BYTES:10485760}
  image:
    max-bytes: ${MEDIA_IMAGE_MAX_BYTES:10485760}
    max-count: ${MEDIA_IMAGE_MAX_COUNT:9}
    max-source-edge: ${MEDIA_IMAGE_MAX_SOURCE_EDGE:8000}
    max-output-edge: ${MEDIA_IMAGE_MAX_OUTPUT_EDGE:2048}
    quality: ${MEDIA_IMAGE_QUALITY:0.85}
  video:
    max-bytes: ${MEDIA_VIDEO_MAX_BYTES:524288000}
    max-duration: ${MEDIA_VIDEO_MAX_DURATION:5m}
    max-width: ${MEDIA_VIDEO_MAX_WIDTH:1920}
    max-height: ${MEDIA_VIDEO_MAX_HEIGHT:1080}
    max-fps: ${MEDIA_VIDEO_MAX_FPS:60}
    max-count: ${MEDIA_VIDEO_MAX_COUNT:1}
  limits:
    ticket-per-minute: ${MEDIA_LIMIT_TICKET_PER_MINUTE:5}
    ticket-per-hour: ${MEDIA_LIMIT_TICKET_PER_HOUR:20}
    upload-per-hour: ${MEDIA_LIMIT_UPLOAD_PER_HOUR:30}
    concurrent-uploads: ${MEDIA_LIMIT_CONCURRENT_UPLOADS:3}
    image-quota-per-day: ${MEDIA_LIMIT_IMAGE_QUOTA_PER_DAY:200}
    video-quota-per-day: ${MEDIA_LIMIT_VIDEO_QUOTA_PER_DAY:10}
    traffic-quota-per-day-bytes: ${MEDIA_LIMIT_TRAFFIC_QUOTA_PER_DAY_BYTES:2147483648}
    read-per-minute-per-ip: ${MEDIA_LIMIT_READ_PER_MINUTE_PER_IP:120}

# 发布模块
post:
  schedule:
    min-lead: ${POST_SCHEDULE_MIN_LEAD:5m}
    max-lead: ${POST_SCHEDULE_MAX_LEAD:365d}
    scan-interval: ${POST_SCHEDULE_SCAN_INTERVAL:60s}
    batch-size: ${POST_SCHEDULE_BATCH_SIZE:200}
    lock-ttl: ${POST_SCHEDULE_LOCK_TTL:55s}
  limits:
    publish-per-hour: ${POST_LIMIT_PUBLISH_PER_HOUR:10}
    autosave-per-minute: ${POST_LIMIT_AUTOSAVE_PER_MINUTE:60}
  draft:
    max-per-user: ${POST_DRAFT_MAX_PER_USER:50}
    retention: ${POST_DRAFT_RETENTION:90d}
  cleanup:
    delete-retention: ${POST_CLEANUP_DELETE_RETENTION:30d}
    scan-interval: ${POST_CLEANUP_SCAN_INTERVAL:10m}
